<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Suscripciones - Coderhouse</title>
    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/main.js"></script>
</head>
<body>
    <div class="container">
        <h1>Gestión de Planes</h1>
        
        <!-- Formulario para agregar un nuevo plan -->
        <form id="form-plan" class="card">
            <h2>Agregar Nuevo Plan</h2>
            <div class="input-group">
                <input type="text" id="input-nombre" placeholder="Nombre del plan" required>
                <input type="number" id="input-precio" placeholder="Precio base" required>
            </div>
            <button type="submit" class="btn-primary">+ Agregar Plan</button>
        </form>

        <!-- Barra de búsqueda por teclado -->
        <div class="search-box">
            <input type="text" id="input-buscar" placeholder="Buscar plan por nombre...">
        </div>

        <!-- Mensajes de feedback visual -->
        <div id="feedback" class="feedback hidden"></div>

        <!-- Contenedor donde se renderizan dinámicamente los planes -->
        <h2>Catálogo Actual</h2>
        <div id="contenedor-planes" class="grid-planes"></div>
    </div>
</body>
</html>
